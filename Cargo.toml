[package]
name = "quotio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "process", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
time = { version = "=0.3.44", features = ["serde", "serde-well-known", "formatting", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6"
base64 = "0.22"
ring = "0.17"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"
core-foundation = "0.10"
security-framework-sys = "2.15"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
