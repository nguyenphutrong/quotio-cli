name: Publish package channels

on:
  release:
    types: [published]

permissions: {}
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Download and verify npm artifact
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          version=${RELEASE_TAG#v}
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "quotio-$version.tgz" --pattern SHA256SUMS
          awk -v name="quotio-$version.tgz" '$2 == name' SHA256SUMS > npm.sha256
          test "$(wc -l < npm.sha256)" -eq 1
          sha256sum --check npm.sha256
      - name: Publish npm with trusted publishing
        run: |
          version=${RELEASE_TAG#v}
          channel=latest
          if [[ "$version" == *-* ]]; then channel=next; fi
          local_integrity=$(node -e 'const fs=require("fs"),c=require("crypto"); console.log("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "quotio-$version.tgz")
          if existing=$(npm view "quotio@$version" dist.integrity --json 2>/dev/null); then
            test "$existing" = "\"$local_integrity\""
            echo 'The identical npm package is already published.'
          else
            npm publish "quotio-$version.tgz" --access public --tag "$channel" --provenance
          fi
  homebrew:
    needs: npm
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
    steps:
      - name: Download and verify formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          formula=quotio.rb
          if [[ "$RELEASE_TAG" == *-* ]]; then formula=quotio-beta.rb; fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$formula" --pattern SHA256SUMS
          awk -v name="$formula" '$2 == name' SHA256SUMS > formula.sha256
          test "$(wc -l < formula.sha256)" -eq 1
          sha256sum --check formula.sha256
          ruby -c "$formula"
      - name: Update existing Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          : "${HOMEBREW_TAP_SSH_KEY:?Set the tap deploy key secret}"
          : "${TAP_REPOSITORY:?Set HOMEBREW_TAP_REPOSITORY}"
          [[ "$TAP_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          formula=quotio.rb
          if [[ "$RELEASE_TAG" == *-* ]]; then formula=quotio-beta.rb; fi
          private=$(mktemp -d)
          trap 'rm -rf "$private"' EXIT
          printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" > "$private/key"
          chmod 600 "$private/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$private/known_hosts"
          test -s "$private/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $private/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$private/known_hosts"
          git clone --depth 1 "git@github.com:$TAP_REPOSITORY.git" "$private/tap"
          mkdir -p "$private/tap/Formula"
          cp "$formula" "$private/tap/Formula/$formula"
          cd "$private/tap"
          git add "Formula/$formula"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(quotio): update to $RELEASE_TAG"
          git push origin HEAD
